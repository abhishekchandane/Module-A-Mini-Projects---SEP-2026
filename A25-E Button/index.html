<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Button Component</title>
        <style>
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: #f0f0f0;
            }

            button {
                font-size: 25px;
                font-weight: bold;
                padding: 25px 50px;
                color: #725ac1;
                background: transparent;
                border: 2px solid #725ac1;
                border-radius: 15px;
                cursor: pointer;
                box-shadow: inset 0 0 0 0 #725ac1;
                transition:
                    color 0.3s,
                    box-shadow 0.3s,
                    transform 0.3s;
            }

            button:hover {
                color: #ffffff;
                box-shadow: inset 0 -100px 0 0 #725ac1;
            }

            button:active {
                transform: scale(0.9);
            }
        </style>
    </head>
    <body>
        <button>Button</button>
    </body>
</html>
