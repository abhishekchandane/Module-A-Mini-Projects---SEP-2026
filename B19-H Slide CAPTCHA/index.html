<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Slide CAPTCHA</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e2e8f0;font:16px system-ui}.wrap{width:600px;max-width:100%;padding:16px;box-sizing:border-box}.scene{position:relative;width:600px;height:400px;max-width:100%;overflow:hidden;background:#94a3b8 center/600px 400px}.hole{position:absolute;width:60px;height:60px;background:#fff8;box-shadow:inset 0 0 0 2px #fff}.piece{position:absolute;width:60px;height:60px;background-size:600px 400px;cursor:grab}.handle{position:relative;margin-top:14px;width:60px;height:32px;border:0;border-radius:16px;background:#2563eb;color:#fff;cursor:grab}.scene.solved .hole{opacity:0}.status{min-height:24px;margin-top:8px;color:#15803d;font-weight:bold}</style></head><body><main class="wrap"><div id="scene" class="scene"><div id="hole" class="hole"></div><div id="piece" class="piece"></div></div><button id="handle" class="handle" type="button">Slide</button><div id="status" class="status" aria-live="polite"></div></main><script>const IMAGES=['assets/1.png','assets/2.png','assets/3.png','assets/4.png','assets/5.png'];const HOLE_Y=100;const TOLERANCE=5;</script><script src="script.js"></script></body></html>
