<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Focus Card</title><link rel="stylesheet" href="style.css" /><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:white;font-family:system-ui}.card:nth-child(1){background-image:linear-gradient(120deg,#1d4ed8,#22d3ee)}.card:nth-child(2){background-image:linear-gradient(120deg,#7c3aed,#f472b6)}.card:nth-child(3){background-image:linear-gradient(120deg,#ea580c,#facc15)}</style></head><body><main class="container"><article class="card"><div class="card-content"><h2>Explore</h2><p>Discover new places.</p></div></article><article class="card"><div class="card-content"><h2>Create</h2><p>Make something memorable.</p></div></article><article class="card"><div class="card-content"><h2>Connect</h2><p>Share your next idea.</p></div></article></main></body></html>
