<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Image Carousel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="a3d" style="--n: 12">
      <div class="card" style="--i: 0"><img src="images/1.png" alt="Carousel image 1" /></div>
      <div class="card" style="--i: 1"><img src="images/2.png" alt="Carousel image 2" /></div>
      <div class="card" style="--i: 2"><img src="images/3.png" alt="Carousel image 3" /></div>
      <div class="card" style="--i: 3"><img src="images/4.png" alt="Carousel image 4" /></div>
      <div class="card" style="--i: 4"><img src="images/5.png" alt="Carousel image 5" /></div>
      <div class="card" style="--i: 5"><img src="images/6.png" alt="Carousel image 6" /></div>
      <div class="card" style="--i: 6"><img src="images/7.png" alt="Carousel image 7" /></div>
      <div class="card" style="--i: 7"><img src="images/8.png" alt="Carousel image 8" /></div>
      <div class="card" style="--i: 8"><img src="images/9.png" alt="Carousel image 9" /></div>
      <div class="card" style="--i: 9"><img src="images/10.png" alt="Carousel image 10" /></div>
      <div class="card" style="--i: 10"><img src="images/11.png" alt="Carousel image 11" /></div>
      <div class="card" style="--i: 11"><img src="images/12.png" alt="Carousel image 12" /></div>
    </div>
  </body>
</html>
